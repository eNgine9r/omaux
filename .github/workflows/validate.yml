name: validate
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh bin/omaux-dock-window bin/omaux-dock-pin bin/omaux-window-controls modules/media/omaux-spotify-mpris
      - name: Python syntax
        run: python -m py_compile bin/omaux-window-layout modules/localization/generate-ukrainian-menu.py modules/menu/apply-pinned-menu-clone.py tests/test_pinned_hyprbars_source.py tests/test_multiwindow_restore.py tests/test_window_layout_state.py tests/test_preview_click_target.py tests/test_spotify_media_safety.py
      - name: Menu clone safety
        run: python tests/test_menu_clone_safety.py
      - name: Pinned remote source safety
        run: python tests/test_pinned_hyprbars_source.py
      - name: Multi-window dock restore safety
        run: python tests/test_multiwindow_restore.py
      - name: Window layout stable-state safety
        run: python tests/test_window_layout_state.py
      - name: Preview click hit-target safety
        run: python tests/test_preview_click_target.py
      - name: Spotify media safety
        run: python tests/test_spotify_media_safety.py
