name: validate
on: [push, pull_request]
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest JSON
        run: python -m json.tool manifest.json >/dev/null
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh bin/omaux-dock-window bin/omaux-dock-pin bin/omaux-window-controls
      - name: Python syntax
        run: python -m py_compile bin/omaux-window-layout modules/localization/generate-ukrainian-menu.py modules/menu/apply-pinned-menu-clone.py tests/test_pinned_hyprbars_source.py
      - name: Menu clone safety
        run: python tests/test_menu_clone_safety.py
      - name: Pinned remote source safety
        run: python tests/test_pinned_hyprbars_source.py
