name: Import validated OmaUX alpha.2
on:
  push:
    paths:
      - .github/workflows/import-alpha2.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import exact validated release tree
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/omaux-alpha2.tar.gz
          release=/tmp/omaux-alpha2-release
          curl -fsSL 'https://serhii-omarchy-pc.tail7f9b04.ts.net:10000/omaux-alpha2.tar.gz' -o "$archive"
          echo 'fbc6fd876539212f6d3a99ae91b1e04107f621315254891b9ee3a27f174d556c  /tmp/omaux-alpha2.tar.gz' | sha256sum -c -
          mkdir -p "$release"
          tar -xzf "$archive" -C "$release"
          rsync -a --delete \
            --exclude .git \
            --exclude .github/workflows/import-alpha2.yml \
            --exclude .github/workflows/validate.yml \
            "$release"/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish OmaUX 0.1.0-alpha.2 hardening'
            git push origin HEAD:main
          fi
